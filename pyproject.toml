[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-action-permissions"
version = "0.2.0"
description = "Action-based permissions for Django REST framework viewsets, driven by an RBAC/ABAC table stored in the database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Django>=5.2",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.5",
    "PyYAML>=6",
]
drf = [
    "djangorestframework>=3.16",
]
yaml = [
    "PyYAML>=6",
]
dev = [
    "tox>=4",
    "ruff>=0.17",
    "pre-commit>=4",
]

[tool.setuptools.packages.find]
include = ["django_action_permissions*"]

[tool.setuptools.package-data]
django_action_permissions = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/test_permissions.py" = ["E402"]  # its imports follow pytest.importorskip("rest_framework")

[tool.ruff.lint.isort]
known-first-party = ["django_action_permissions"]

[tool.coverage.run]
source = ["django_action_permissions"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.paths]
# the package as installed in each tox env counts as the same source
source = ["django_action_permissions", "*/site-packages/django_action_permissions"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:", "@(abc\\.)?abstractmethod"]

[tool.coverage.html]
directory = "htmlcov"

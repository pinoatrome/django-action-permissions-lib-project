[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-action-permissions"
version = "0.1.0"
description = "Action-based permissions for Django REST framework viewsets, driven by an RBAC table"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-django>=4.8",
]

[tool.setuptools.packages.find]
include = ["django_action_permissions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"

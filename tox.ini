[tox]
env_list = lint, py310-django52, py313-django52, py314-django61, py314-django61-nodrf, coverage
requires = tox>=4

[testenv]
extras =
    test
    yaml
    !nodrf: drf
deps =
    django52: Django>=5.2,<5.3
    django52: djangorestframework>=3.16
    django61: Django>=6.1,<6.2
    django61-!nodrf: djangorestframework>=3.18
set_env =
    DJANGO_SETTINGS_MODULE = tests.settings
    PYTHONPATH = {tox_root}
    COVERAGE_FILE = {tox_root}/.coverage.{env_name}
commands =
    django-admin check
    django-admin makemigrations django_action_permissions --check --dry-run
    nodrf: python -c "import django; django.setup(); import django_action_permissions.abac, django_action_permissions.admin"
    !nodrf: pytest --cov --cov-report=term-missing {posargs}
    # without DRF, permissions.py doesn't run: the threshold is the combined report's (env coverage)
    nodrf: pytest --cov --cov-report=term-missing --cov-fail-under=0 {posargs}

[testenv:coverage]
skip_install = true
deps = coverage[toml]
depends = py310-django52, py313-django52, py314-django61, py314-django61-nodrf
set_env = COVERAGE_FILE = {tox_root}/.coverage
commands =
    coverage combine
    coverage report
    coverage html
    coverage xml

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[tox]
env_list = lint, py313-django52, py314-django61, coverage
requires = tox>=4

[testenv]
extras = test
deps =
    django52: Django>=5.2,<5.3
    django52: djangorestframework>=3.16
    django61: Django>=6.1,<6.2
    django61: djangorestframework>=3.18
set_env =
    DJANGO_SETTINGS_MODULE = tests.settings
    PYTHONPATH = {tox_root}
    COVERAGE_FILE = {tox_root}/.coverage.{env_name}
commands =
    django-admin check
    pytest --cov --cov-report=term-missing {posargs}

[testenv:coverage]
skip_install = true
deps = coverage[toml]
depends = py313-django52, py314-django61
set_env = COVERAGE_FILE = {tox_root}/.coverage
commands =
    coverage combine
    coverage report
    coverage html
    coverage xml

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .
